filebeat.inputs:
  - type: filestream
    id: weather-app-logs
    enabled: true

    paths:
      - /var/log/weather-app/*.log

    parsers:
      - ndjson:
          target: "app"
          add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"