filebeat.inputs:

  # -------------------------------------------------------------------
  # App logs: one file per replica per server, e.g.
  #   weather-app-A-http.log, weather-app-A-grpc.log, ...
  # (same input as A1/A2 -- the glob already matches the new file names,
  #  and it does NOT go into the envoy/ subfolder)
  # -------------------------------------------------------------------
  - type: filestream
    id: weather-app-logs
    enabled: true
    paths:
      - /var/log/weather-app/*.log
    parsers:
      - ndjson:
          target: "app"          # fields land under app.*, as in A1/A2
          add_error_key: true
    processors:
      # Use the time the app logged the event as @timestamp, not the
      # (slightly later) time Filebeat read it, so Kibana time ranges
      # line up with Grafana's for the same run.
      - timestamp:
          field: app.timestamp
          layouts:
            - '2006-01-02T15:04:05Z07:00'
          ignore_missing: true

  # -------------------------------------------------------------------
  # A3: Envoy's JSON access log (one line per proxied request / call)
  # -------------------------------------------------------------------
  - type: filestream
    id: envoy-access-logs
    enabled: true
    paths:
      - /var/log/weather-app/envoy/*.log
    parsers:
      - ndjson:
          # Separate namespace (envoy.*) so Envoy's fields can never clash
          # with the app's in Elasticsearch (both have "status", for example).
          target: "envoy"
          add_error_key: true
    processors:
      - timestamp:
          field: envoy.start_time
          layouts:
            - '2006-01-02T15:04:05Z07:00'
          ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"
