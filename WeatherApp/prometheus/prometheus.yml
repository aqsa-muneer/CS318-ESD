global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "weather-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"

  - job_name: "weather-grpc"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9101"

  - job_name: "node-exporter"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          machine: "AM-dev-machine"
