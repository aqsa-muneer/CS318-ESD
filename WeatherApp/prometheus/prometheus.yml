global:
  scrape_interval: 5s

scrape_configs:
  # FASTAPI APPLICATION METRICS
  - job_name: "weather-app"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:8000"

  # SYSTEM METRICS FROM NODE EXPORTER
  - job_name: "node-exporter"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "node-exporter:9100"